<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1080px; }
body { background: linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  padding:0 110px; position:relative; overflow:hidden; }
.title { color:#fff; font-weight:800; font-size:90px; line-height:1.3; word-break:keep-all; overflow-wrap:break-word; }
.sub { margin-top:40px; color:#b8bcc8; font-weight:500; font-size:36px; }
.cards { margin-top:56px; display:flex; flex-wrap:wrap; justify-content:center; gap:16px; width:860px; }
.c { padding:16px 26px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12);
  border-radius:16px; color:#fff; font-size:30px; font-weight:600; }
.accent { position:absolute; left:80px; top:70px; font-family:"JetBrains Mono","D2Coding",Consolas,Menlo,monospace;
  font-weight:700; font-size:130px; color:#4f8cff; opacity:.7; line-height:1; }
</style></head><body>
<div class="title">성경 자녀양육,<br>다섯 구절로<br>읽어본다</div>
<div class="sub">성경 해석 · 자녀양육</div>
<div class="cards">
<div class="c">에베소서 6:4</div><div class="c">골로새서 3:21</div><div class="c">신명기 6:4~7</div>
<div class="c">잠언 22:6</div><div class="c">잠언 13:24</div></div>
<div class="accent">{ }</div>
</body></html>
