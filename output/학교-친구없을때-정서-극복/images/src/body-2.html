<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>

.top,.tile,.who { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:20px; }
.top { padding:28px 36px; display:flex; align-items:center; gap:32px; }
.big { font-size:76px; font-weight:800; color:#4f8cff; line-height:1.1; white-space:nowrap; }
.lab { font-size:30px; line-height:1.4; }
.lab small { display:block; color:#b8bcc8; font-size:26px; margin-top:4px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px; }
.tile { padding:24px 32px; }
.tile .big { font-size:60px; }
.tile .lab { margin-top:6px; font-size:28px; }
.who { margin-top:20px; padding:24px 36px; display:flex; align-items:center; gap:32px; border-color:rgba(79,140,255,0.5); }
.who .big { font-size:60px; }
</style></head><body>
<div class="heading"><i>02</i>외로움을 겪는 학생은 얼마나 될까</div>
<div class="top"><div class="big">3명 중 1명</div><div class="lab">이유 없이 외로웠던 경험<small>한국 아동청소년, 웹진 서술</small></div></div>
<div class="grid">
<div class="tile"><div class="big">9.5%</div><div class="lab">외부적 고립<br>(관계망 부족)</div></div>
<div class="tile"><div class="big">13.9%</div><div class="lab">스스로 고립되었다고<br>인지</div></div>
<div class="tile"><div class="big">1.4%</div><div class="lab">‘항상’ 고립</div></div>
<div class="tile"><div class="big">25.3%</div><div class="lab">고립감을 느끼는 학생 중<br>2년 이상 지속</div></div>
</div>
<div class="who"><div class="big">21%</div><div class="lab">청소년 외로움 비율 (전 세계)<small>WHO 사회적 연결 위원회, 2025-06-30</small></div></div>
<div class="note">한국 수치는 교육정책네트워크 정보센터(KEDI) 웹진 서술 기준이다. 조사 연도와 원 보고서는 확인하지 못했고, 조사 주체 표기가 자료마다 다르다.</div>
</body></html>
