<div class="heading"><i>03</i>외로움과 따돌림의 구분</div>

<div class="mid"><div class="line"></div><div class="t">외로움이 따돌림 피해에서 비롯되었는지<br>판별하는 방법은 소스에서 확인하지 못함</div><div class="line"></div></div>
<div class="box"><h3>가해 행위가 있는 따돌림</h3>

<div class="apr"><span>접근</span>교육부 5차 기본계획 등 별도 체계</div></div>
