<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.cards { display:grid; gap:24px; }
.pcard { padding:32px 40px; }
.idx { display:block; font-family:"JetBrains Mono","D2Coding",Consolas,Menlo,monospace; color:#4f8cff; font-weight:700; font-size:28px; margin-bottom:12px; }
.pcard b { display:block; font-size:42px; font-weight:800; }
.pcard b span { font-family:"Pretendard","Malgun Gothic",sans-serif; font-size:30px; font-weight:600; color:#b8bcc8; margin-left:10px; }
.pcard p { margin-top:10px; font-size:32px; line-height:1.5; }
.pcard small { display:block; margin-top:8px; color:#b8bcc8; font-size:28px; line-height:1.5; }
</style></head><body>
<div class="heading">세 단어의 원어 풀이</div>
<div class="cards">
<div class="card pcard"><span class="idx">01</span><b class="mono">parorgizo<span>에베소서 6:4</span></b><p>곁에서 화나게 하다, 격노하게 하다</p><small>para(곁에서) + orgizo</small></div>
<div class="card pcard"><span class="idx">02</span><b class="mono">erethizo<span>골로새서 3:21</span></b><p>자극해 반응하게 하다</p><small>나쁜 뜻으로는 짜증나게·분하게 하다<br>신약에서 골 3:21과 고후 9:2에만 나옴</small></div>
<div class="card pcard"><span class="idx">03</span><b class="mono">athymeo<span>골로새서 3:21 낙심</span></b><p>a(없음) + thumos(기운·열정)</p></div>
</div></body></html>
